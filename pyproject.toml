[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solution"
version = "0.1.0"
description = "初中化学溶液工具：质量分数、稀释加水、溶解度查询与练习纸生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["python", "education", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Natural Language :: Chinese (Simplified)",
]

[project.scripts]
solution = "solution.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/solution"
Source = "https://github.com/eastyou/solution"

[tool.setuptools]
packages = ["solution"]
